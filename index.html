// 시도 표준 순서: 서울 → ... → 세종 → 경기 → ... → 제주
const REGION_ORDER = Object.keys(REGION_FULL_NAME);

const presentRegions = Array.from(new Set(DATA.map(d => d.region)))
    .sort((a, b) => REGION_ORDER.indexOf(a) - REGION_ORDER.indexOf(b));

const REGIONS = ["전체", ...presentRegions];
let activeRegion = "전체";

function renderChips(){
    const row = document.getElementById('chipRow');
    row.innerHTML = REGIONS.map(r => {
        const count = r === "전체" ? DATA.length : DATA.filter(d => d.region === r).length;
        return `<button class="chip shrink-0 px-4 py-2 rounded-full text-xs sm:text-sm font-black border border-orange-200 dark:border-slate-700"
                    data-active="${r === activeRegion}" data-region="${r}">${r} <span class="opacity-70">${count}</span></button>`;
    }).join('');
    row.querySelectorAll('.chip').forEach(btn => {
        btn.addEventListener('click', () => {
            activeRegion = btn.dataset.region;
            renderChips();
            renderCards();
        });
    });
}

// 선거구 순서 정렬: 시/도별 공식 선거구 번호 순서(예: 서울 종로구→강동구) → 갑/을/병/정/무 순
const SUFFIX_ORDER = {"갑":1, "을":2, "병":3, "정":4, "무":5, "기":6};

// 각 시/도의 공식 선거구 획정 순서(중앙선거관리위원회 고시 기준). 여기 없는 지역은 원래 배열 순서를 유지.
const REGION_DISTRICT_ORDER = {
    "서울": ["종로구","중구·성동구","용산구","광진구","동대문구","중랑구","성북구","강북구","도봉구","노원구","은평구","서대문구","마포구","양천구","강서구","구로구","금천구","영등포구","동작구","관악구","서초구","강남구","송파구","강동구"],
    "대구": ["중구·남구","동구·군위군","서구","북구","수성구","달서구","달성군"],
    "인천": ["중구·강화군·옹진군","동구·미추홀구","연수구","남동구","부평구","계양구","서구"],
    "대전": ["동구","중구","서구","유성구","대덕구"],
    "세종": ["세종시"],
    "경기": ["수원시","성남시","의정부시","안양시","부천시","광명시","평택시","안산시","동두천시","양주시","연천군","고양시","의왕시","과천시","구리시","남양주시","오산시","시흥시","군포시","하남시","용인시","파주시","이천시","안성시","김포시","화성시","광주시","포천시","가평군","여주시","양평군"],
    "제주": ["제주시","서귀포시"]
};

function getSuffixRank(district){
    const suffix = district.trim().slice(-1);
    return SUFFIX_ORDER[suffix] ?? 0;
}

function getRegionRank(c){
    const order = REGION_DISTRICT_ORDER[c.region];
    if(!order) return -1; // 정의되지 않은 지역은 원본 배열 순서를 그대로 사용(추후 stable sort로 유지)
    const haystack = `${c.district} ${c.city}`;
    const idx = order.findIndex(key => haystack.includes(key));
    return idx === -1 ? order.length : idx;
}

function districtSort(a, b){
    return getRegionRank(a) - getRegionRank(b) || (getSuffixRank(a.district) - getSuffixRank(b.district));
}

function renderCards(){
    const container = document.getElementById('cardSections');
    const regionsToShow = activeRegion === "전체" ? presentRegions : [activeRegion];

    container.innerHTML = regionsToShow.map(region => {
        const list = DATA.filter(d => d.region === region).sort(districtSort);
        return `
            <section>
                <div class="flex items-center gap-2 mb-5">
                    <span class="w-1 h-5 bg-[#FF6600] rounded-full"></span>
                    <h2 class="text-lg sm:text-xl font-black text-slate-900 dark:text-white">${REGION_FULL_NAME[region] || region}</h2>
                    <span class="text-xs font-black text-orange-500 bg-orange-50 dark:bg-orange-900/30 px-2.5 py-1 rounded-full">${list.length}명</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                    ${list.map(cardHTML).join('')}
                </div>
            </section>
        `;
    }).join('');
}

document.getElementById('headerCount').textContent = `전국 ${DATA.length}개 선거구 · 계속 추가 예정중`;
document.getElementById('footerCount').textContent = DATA.length;

renderChips();
renderCards();
</script>
</body>
</html>
